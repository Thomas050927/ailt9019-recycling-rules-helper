name: Deploy Campus Waste Guide PWA

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application files
        run: |
          node --input-type=module --check < app/app.js
          python -m json.tool app/manifest.webmanifest > /dev/null
          python -m json.tool app/hku-sources.json > /dev/null
          test -s app/index.html
          test -s app/styles.css
          test -s app/sw.js
      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
